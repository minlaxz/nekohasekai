<!-- Form page -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create SSM User</title>
  </head>
  <body>
    {% if not config_url or not import_url %}
    <h2>Create SSM User</h2>

    <form method="POST" action="/ssm/create">
      <label>Username:</label><br />
      <input type="text" name="username" required pattern="{{ pattern[1:-1] }}" /><br /><br />
      <button type="submit">Submit</button>
    </form>
    {% else %}
    <h2>SSM User Created Successfully!</h2>
    <hr />
    <h3>Generated Link:</h3>
    <pre>{{ config_url }}</pre>
    <a href="{{ import_url }}">Redirect to import link</a>
    {% endif %}
  </body>
</html>
