name: sing-box

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sing-box-api:
    image: ghcr.io/minlaxz/nekohasekai:neko-api
    # Resource limits
    mem_limit: 128m
    mem_reservation: 64m
    memswap_limit: -1 # no swap limit
    # Networks and ports
    networks:
      - caddy-net
      - sing-box-net
    expose:
      - "8000"
    # Env and volumes
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - sing-box-configs:/sing-box:ro
      - ./users.json:/users.json
    # Loggings and others
    labels:
      caddy: ${APP_HOST?}
      caddy.reverse_proxy: "{{upstreams 8000}}"
    logging:
      <<: *default-logging
    restart: unless-stopped

  sing-box:
    image: ghcr.io/minlaxz/nekohasekai:neko
    # Resource limits
    mem_limit: 128m
    mem_reservation: 64m
    memswap_limit: -1 # no swap limit
    # Networks and ports
    networks:
      - sing-box-net
    ports:
      - "${SHADOWTLS_PORT?}:${SHADOWTLS_PORT?}/tcp"
      - "${HYSTERIA2_PORT?}:${HYSTERIA2_PORT?}/udp"
    # Env and volumes
    environment:
      - SHADOWSOCKS_PORT=${SHADOWSOCKS_PORT?}
      - SHADOWSOCKS_PASSWORD=${SHADOWSOCKS_PASSWORD?}
      - SHADOWTLS_PORT=${SHADOWTLS_PORT?}
      - HYSTERIA2_PORT=${HYSTERIA2_PORT?}
      - HYSTERIA2_PASSWORD=${HYSTERIA2_PASSWORD?}
      - HYSTERIA2_OBFS_PASSWORD=${HYSTERIA2_OBFS_PASSWORD?}
      - SHADOWTLS_SNI=${SHADOWTLS_SNI?}
      - SHADOWTLS_PASSWORD=${SHADOWTLS_PASSWORD?}
      - PUBLIC_IP=${PUBLIC_IP:-}
    volumes:
      - sing-box-configs:/sing-box
    # Loggings and others
    logging:
      <<: *default-logging
    restart: unless-stopped

networks:
  caddy-net:
    external: true
  sing-box-net:

volumes:
  sing-box-configs: {}
